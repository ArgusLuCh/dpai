{% extends 'base.html' %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <span class="badge bg-danger">ADMINISTRADOR</span> Resetear Contraseña
        </div>
        <div class="card-body">
          {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          
          <div class="alert alert-info">
            <strong>Usuario:</strong> {{ usuario['nombre_completo'] or usuario['nombre_usuario'] }}<br>
            <strong>Nombre de usuario:</strong> {{ usuario['nombre_usuario'] }}
          </div>
          
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Nueva Contraseña</label>
              <input type="password" name="nueva_contrasena" class="form-control" required minlength="4">
              <small class="form-text text-muted">Mínimo 4 caracteres</small>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirmar Nueva Contraseña</label>
              <input type="password" name="confirmar_contrasena" class="form-control" required minlength="4">
            </div>
            <div class="d-flex justify-content-between">
              <a href="/usuarios" class="btn btn-secondary">Cancelar</a>
              <button type="submit" class="btn btn-warning">Resetear Contraseña</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
