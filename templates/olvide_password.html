<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Olvidé mi contraseña - Registro de Actuaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  </head>
  <body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background-color:#ffffff;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card">
            <div class="card-header bg-primary text-white text-center">
              <h5 class="mb-0">Recuperar contraseña</h5>
            </div>
            <div class="card-body">
              {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
              {% endif %}
              {% if success %}
              <div class="alert alert-success">{{ success }}</div>
              {% endif %}

              <form method="post">
                <div class="mb-3">
                  <label class="form-label">Usuario</label>
                  <input type="text" name="nombre_usuario" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Nueva contraseña</label>
                  <input type="password" name="nueva_contrasena" class="form-control" required minlength="4">
                  <small class="text-muted">Mínimo 4 caracteres</small>
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirmar nueva contraseña</label>
                  <input type="password" name="confirmar_contrasena" class="form-control" required minlength="4">
                </div>
                <button class="btn btn-primary w-100" type="submit">Actualizar contraseña</button>
              </form>
            </div>
            <div class="card-footer text-center">
              <a href="/login">Volver al login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
