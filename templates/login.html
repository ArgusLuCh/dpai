<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#04061c">
    <title>Iniciar sesión — DPAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='logo_policia.png') }}" alt="Logo Policía de Salta" class="auth-logo">
        </div>
        <div class="card">
          <div class="card-header">Registro de Actuaciones</div>
          <div class="card-body">
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="post">
              <div class="mb-2">
                <label class="form-label">Usuario</label>
                <input type="text" name="nombre_usuario" class="form-control" required autofocus>
              </div>
              <div class="mb-2">
                <label class="form-label">Contraseña</label>
                <input type="password" name="contrasena" class="form-control" required>
              </div>
              <button class="btn btn-success w-100 mt-2">Entrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
