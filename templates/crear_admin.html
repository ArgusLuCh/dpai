<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Administrador - Registro de Actuaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  </head>
  <body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card">
            <div class="card-header bg-danger text-white text-center">
              <h5 class="mb-0">Crear Administrador</h5>
            </div>
            <div class="card-body">
              <p class="alert alert-info">Solo se pueden crear 3 administradores. Después no será posible crear más.</p>
              {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
              {% endif %}
              <form method="post">
                <div class="mb-3">
                  <label class="form-label">Usuario administrador</label>
                  <input type="text" name="nombre_usuario" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Nombre completo</label>
                  <input type="text" name="nombre_completo" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" name="contrasena" class="form-control" required>
                </div>
                <button class="btn btn-danger w-100">Crear Administrador</button>
              </form>
            </div>
            <div class="card-footer text-center text-muted">
              <a href="/login">Volver al login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
